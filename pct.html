<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסע האחוזים – ח1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: מחברת חשבון של תלמיד – ברור, חם, לא ילדותי
   IDEA: דף משבצות; כל רמה היא עמוד במחברת
   PICTURE: הגרף/הטבלה של השאלה הוא המרכז של המסך
   COLOUR and TYPE: לבן משבצות, דיו כהה, ירוק גרף, כתום לסימון; Rubik
   LAYOUT: טור אחד לטלפון, כפתורים גדולים, פס התקדמות למעלה */
:root{--bg:#fbfaf6;--ink:#1d2433;--soft:#5b6475;--line:#e6e2d6;--green:#1f8a70;--greenbg:#e3f4ee;--orange:#e4572e;--orangebg:#fde9e2;--card:#fff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:17px/1.55 Rubik,Arial,sans-serif;min-height:100vh;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{position:sticky;top:0;z-index:5;background:rgba(251,250,246,.96);backdrop-filter:blur(4px);margin:0 -14px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lv{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{min-width:34px;height:34px;border-radius:17px;display:grid;place-items:center;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--soft)}
.chip.done{background:var(--green);border-color:var(--green);color:#fff}
.chip.now{border-color:var(--ink);color:var(--ink)}
.who{margin-inline-start:auto;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.bar{height:8px;background:#ece8dc;border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:0 2px 0 rgba(29,36,51,.05)}
h1{font-size:30px;line-height:1.1;margin:8px 0 6px;text-wrap:balance}
h2{font-size:23px;line-height:1.2;margin:0 0 8px}
.q{font-size:19px;font-weight:500;margin:0 0 12px}
.m{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.08em;white-space:nowrap;unicode-bidi:isolate}
.fig{margin:6px 0 14px;display:flex;justify-content:center}
svg.g{width:100%;max-width:330px;height:auto;border-radius:8px}
svg.g.sm{max-width:none}
svg.qfig{width:100%;max-width:330px;height:auto;border-radius:8px;border:1px solid var(--line)}
.gl{stroke:#dfe3ea;stroke-width:1}.ax{stroke:#1d2433;stroke-width:1.6}.ln{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g text{direction:ltr;unicode-bidi:bidi-override}.tk{fill:#5b6475;font-family:Rubik,Arial,sans-serif}.al{fill:#1d2433;font-style:italic;font-family:"Times New Roman",serif}
table.vt{border-collapse:collapse;margin:0 auto;font-size:17px;background:#fff}
table.vt th,table.vt td{border:1.5px solid #9aa3b2;padding:6px 10px;text-align:center;font-family:"Times New Roman",serif}
table.vt th{background:#eef1f5;font-style:italic}
.opts{display:grid;gap:10px}
.opts.svg,.opts.tbl{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:54px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:inherit;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opts.svg .opt,.opts.tbl .opt{flex-direction:column;padding:8px}
.opt .let{flex:none;width:28px;height:28px;border-radius:14px;background:#eef1f5;display:grid;place-items:center;font-weight:700;font-size:14px}
.opts.tbl table.vt{font-size:14px}.opts.tbl table.vt td,.opts.tbl table.vt th{padding:3px 6px}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.opt.ok{border-color:var(--green);background:var(--greenbg)}
.opt.no{border-color:var(--orange);background:var(--orangebg)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:16px}
.fb.ok{background:var(--greenbg);border:1px solid #b6e0d2}
.fb.no{background:var(--orangebg);border:1px solid #f4c3b3}
.fb b.t{display:block;font-size:18px;margin-bottom:4px}
.hint{margin-top:12px;padding:12px;border-radius:12px;background:#fff7d6;border:1px solid #f0e1a0;font-size:16px}
.btn{display:block;width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:700 18px Rubik,Arial,sans-serif;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.gr{background:var(--green)}
select.name{appearance:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
input.name,select.name,input.ans{width:100%;min-height:52px;border:2px solid #c9cfda;border-radius:12px;padding:10px 14px;font:18px Rubik,Arial,sans-serif;background:#fff;color:var(--ink)}
input.ans{direction:ltr;text-align:center;font-size:22px}
.big{font-size:58px;font-weight:700;line-height:1;margin:8px 0}
.muted{color:var(--soft);font-size:15px}
.ul{margin:8px 0 0;padding-inline-start:20px}
.streak{display:flex;gap:6px;margin:4px 0 12px}
.streak span{flex:1;height:10px;border-radius:5px;background:#ece8dc}
.streak span.on{background:var(--orange)}
.stat{display:flex;gap:10px;margin:6px 0 12px}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:28px}
.err{color:var(--orange);font-size:15px;margin-top:8px}
.demo{background:#fff7d6;border:1px solid #f0e1a0;border-radius:10px;padding:6px 10px;font-size:14px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.demo button{min-width:36px;min-height:36px;border:1px solid #c9b860;border-radius:8px;background:#fff;font:700 15px Rubik,Arial,sans-serif;cursor:pointer}
.pg{width:100%;max-width:300px;height:auto}
.bars{width:100%;max-width:360px;display:grid;gap:8px}.br{display:grid;grid-template-columns:5.5em 1fr 3em;gap:8px;align-items:center;font-size:15px}.bb{height:18px;background:#ece8dc;border-radius:4px;overflow:hidden}.bb i{display:block;height:100%;background:#3b6fb6}.bv{direction:ltr;text-align:left;font-weight:700}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:500 15px Rubik,Arial,sans-serif;color:var(--ink);cursor:pointer}
.task{margin-top:8px;padding:8px 10px;border-radius:10px;background:#eef4ff;border:1px solid #c9d8f5;font-size:14px}
.task .bar{margin-top:6px;background:#dbe5f7}.task .bar i{background:#2b6cb0}
.task.done{background:var(--greenbg);border-color:#b6e0d2}
.nudge{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff7d6;border:1px solid #f0e1a0;font-size:14px}
.tl{display:grid;gap:8px;margin:8px 0 14px}
.tp{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:16px Rubik,Arial,sans-serif;color:var(--ink);text-align:start;cursor:pointer}
.tp[disabled]{cursor:default;opacity:.65}
.dot{flex:none;width:16px;height:16px;border-radius:8px;background:#d5d9e0}
.dot.g{background:var(--green)}.dot.y{background:#e9b949}.dot.r{background:var(--orange)}
.tp .sm{margin-inline-start:auto;font-size:13px;color:var(--soft);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--soft);margin:4px 0 10px}.legend span{display:flex;align-items:center;gap:5px}.legend .dot{width:12px;height:12px}
.tip{background:#f4f7fb;border-radius:12px;padding:12px;margin:8px 0}
.ex{border:1.5px dashed #c9cfda;border-radius:12px;padding:12px;margin:10px 0}
.ex .ans{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--greenbg)}
h3{font-size:18px;margin:14px 0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var CONF = {"app":"pct","book":"כיוון ח׳ כרך ב׳","ls":"pctq_v1","title":"מסע האחוזים","page":"מסע האחוזים – ח1","sub":"ח׳1 · אחוזים – חזרה (כיוון ח׳ כרך ב׳, פרק 1)","ldesc":{"1":"אחוזים כשבר וכמספר עשרוני, אחוז מתוך שרטוט, אחוזים נוחים כמו 10% ו־25%, וכמה אחוזים הם חלק מהשלם.","2":"חלק מהשלם, השלם מתוך חלק, מחיר אחרי הגדלה או הקטנה, הגדלה והקטנה ככפל, אחוז השינוי, אחוזים מעל 100%.","3":"שינויים רצופים, מחיר מקורי לפני שינוי, רווח, אחוזים מהנותרים, \"גדול ב־ / קטן ב־\", דיאגרמה ושאלות הבנה."},"expIntro":"סדרה של 6 שאלות שבהן תגלו למה עלייה ב־20% ואחריה ירידה ב־20% לא מחזירות למחיר המקורי. אם טעיתם – תקבלו רמז ותנסו שוב. אין כאן ציון.","expDone":"בשינויים רצופים כל אחוז מחושב מהערך \u003cb>שלפניו\u003c/b>, ולכן מכפילים את המכפלות (למשל \u003cspan class=\"m\" dir=\"ltr\">1.2 · 0.8 = 0.96\u003c/span>) ולא מחברים אחוזים."};
/* מחוללי שאלות – אחוזים, ח1 (ארכימדס "כיוון" ח כרך ב, פרק 1, עמ' 4–30) */
var GEN = (function () {
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function near(a, b) { return Math.abs(a - b) < 1e-9; }
  function r2(n) { return Math.round(n * 1000) / 1000; }
  function fmt(n) { n = r2(n); var s = String(Math.abs(n)); return (n < 0 ? '−' : '') + s; }
  function M(s) { return '<span class="m" dir="ltr">' + s + '</span>'; }
  function P(v) { return fmt(v) + '%'; }               // אחוז בטקסט עברי
  function N(v) { return fmt(v); }                      // מספר
  function S(v) { return fmt(v) + ' ש"ח'; }             // שקלים
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function frac(n, d) { var g = gcd(n, d); return M((n / g) + '/' + (d / g)); }
  function isNice(v) { return Number.isInteger(r2(v * 2)); }

  function finalize(correctHtml, wrongHtmls) {
    var seen = {}; seen[correctHtml] = 1; var w = [];
    for (var i = 0; i < wrongHtmls.length && w.length < 3; i++) { var h = wrongHtmls[i]; if (h == null || seen[h]) continue; seen[h] = 1; w.push(h); }
    if (w.length < 3) throw new Error('not enough distractors: ' + correctHtml);
    var all = shuffle([{ h: correctHtml, ok: true }].concat(w.map(function (h) { return { h: h, ok: false }; })));
    return { options: all.map(function (o) { return o.h; }), answer: all.findIndex(function (o) { return o.ok; }) };
  }
  // מסיחים מספריים: חיוביים, "נוחים" (כפולות של 0.5) ושונים מהתשובה
  function numOpts(correct, cands, wrap, anyDec) {
    wrap = wrap || N;
    var vals = [], seen = [correct];
    function add(v) { if (!isFinite(v) || v <= 0) return; v = r2(v); if (!anyDec && !isNice(v)) return; for (var k = 0; k < seen.length; k++) if (near(seen[k], v)) return; seen.push(v); vals.push(v); }
    cands.forEach(add);
    var fb = [correct * 2, correct / 2, correct + 10, correct + 5, correct - 5, correct + 1, correct - 1, correct * 10, correct + 20];
    for (var i = 0; vals.length < 3 && i < fb.length; i++) add(fb[i]);
    var r = finalize(wrap(correct), vals.slice(0, 3).map(wrap));
    r.val = function (i) { return parseNum(r.options[i]); };
    return r;
  }
  function stripM(h) { return String(h).replace(/<[^>]+>/g, '').replace(/&lt;/g, '<'); }
  function parseNum(h) { return Number(stripM(h).replace(/−/g, '-').replace(/[^\d.\-]/g, '')); }
  function mk(type, prompt, r, expl, ok, extra) {
    var q = { type: type, prompt: prompt, fig: '', options: r.options, answer: r.answer, expl: expl, check: function (i) { return ok(i); } };
    if (extra) for (var k in extra) q[k] = extra[k];
    return q;
  }

  /* ---------- שרטוטים ---------- */
  function grid(n, cols, k) { // n משבצות, cols בשורה, k צבועות
    var rows = n / cols, c = 26, W = cols * c, H = rows * c;
    var s = '<svg class="pg" viewBox="0 0 ' + (W + 2) + ' ' + (H + 2) + '" xmlns="http://www.w3.org/2000/svg" role="img">';
    for (var i = 0; i < n; i++) { var x = (i % cols) * c + 1, y = Math.floor(i / cols) * c + 1; s += '<rect x="' + x + '" y="' + y + '" width="' + c + '" height="' + c + '" fill="' + (i < k ? '#3b6fb6' : '#fff') + '" stroke="#9aa3b2" stroke-width="1"/>'; }
    return s + '</svg>';
  }
  function bars(items) { // [label, pct]
    return '<div class="bars">' + items.map(function (it) { return '<div class="br"><span class="bl">' + it[0] + '</span><span class="bb"><i style="width:' + it[1] + '%"></i></span><span class="bv">' + it[1] + '%</span></div>'; }).join('') + '</div>';
  }

  var T = {};
  /* ================= רמה 1 ================= */
  T.pctToFrac = function () {
    var p = pick([10, 20, 25, 50, 75, 40, 30]);
    var cands = [frac(p, 10), frac(1, p), frac(p, 1000), frac(100 - p, 100), frac(1, 100 - p > 1 ? 100 - p : 3)].filter(function (h) { return h !== frac(p, 100); });
    var vals = function (h) { var m = stripM(h).split('/'); return Number(m[0]) / Number(m[1]); };
    var C = frac(p, 100), r = finalize(C, shuffle(cands).filter(function (h) { return !near(vals(h), p / 100); }));
    return mk('אחוז כשבר', 'איזה שבר שווה ל־' + P(p) + '?', r, P(p) + ' הם ' + p + ' חלקים מתוך 100: ' + M(p + '/100') + ', ובצמצום ' + C + '.', function (i) { return near(vals(r.options[i]), p / 100); });
  };
  T.pctDec = function () {
    var p = pick([35, 60, 12, 90, 45, 25, 80, 50]);
    if (Math.random() < 0.5) {
      var r = numOpts(p / 100, [p / 10, p, p / 1000, p / 100 * 10], function (v) { return M(N(v)); }, true);
      return mk('אחוז כמספר עשרוני', 'איך כותבים ' + P(p) + ' כמספר עשרוני?', r, P(p) + ' הם ' + M(p + '/100') + ', כלומר ' + M(N(p / 100)) + '. מחלקים ב־100: הנקודה העשרונית זזה שני מקומות שמאלה.', function (i) { return near(r.val(i), p / 100); });
    }
    var r2_ = numOpts(p, [p / 10, p / 100, p * 10], P);
    return mk('מספר עשרוני כאחוז', 'המספר ' + M(N(p / 100)) + ' שווה ל:', r2_, M(N(p / 100) + ' = ' + p + '/100') + ', כלומר ' + P(p) + '. כופלים ב־100.', function (i) { return near(r2_.val(i), p); });
  };
  T.fracToPct = function () {
    var d = pick([2, 4, 5, 10, 10]), n = ri(1, d - 1); if (gcd(n, d) !== 1 && d !== 10) n = 1;
    var p = n / d * 100;
    var r = numOpts(p, [n, d, n * 10, 100 - p, d * n], P);
    return mk('שבר כאחוז', 'השבר ' + frac(n, d) + ' שווה ל:', r, 'מרחיבים כך שהמכנה יהיה 100: ' + M(n + '/' + d + ' = ' + N(p) + '/100') + ', כלומר ' + P(p) + '.', function (i) { return near(r.val(i), p); });
  };
  T.grid = function () {
    var v = Math.random() < 0.85, n = v ? 100 : 20, cols = 10, k = v ? ri(3, 97) : ri(1, 19), p = k / n * 100;
    var r = numOpts(p, v ? [100 - p, k / 10, p + 10] : [k, 100 - p, k * 10, n - k], P);
    return mk('אחוז מתוך שרטוט', 'איזה אחוז מהמשבצות צבוע בכחול?', r,
      v ? 'יש 100 משבצות, ו־' + k + ' מהן צבועות: ' + k + ' מתוך 100 הם ' + P(p) + '.' : 'יש 20 משבצות, ו־' + k + ' מהן צבועות: ' + M(k + '/20 = ' + N(p) + '/100') + ', כלומר ' + P(p) + '.',
      function (i) { return near(r.val(i), p); }, { fig: grid(n, cols, k) });
  };
  T.easyPart = function () {
    var p = pick([10, 10, 50, 50, 25]), X = pick(p === 25 ? [40, 80, 100, 200] : [20, 40, 60, 80, 100, 200]), a = X * p / 100;
    var r = numOpts(a, [X / p, X * p / 10, X - a, X / 10 === a ? X / 5 : X / 10]);
    return mk('חלק מהשלם (אחוזים נוחים)', 'כמה הם ' + P(p) + ' מ־' + N(X) + '?', r,
      { 10: 'כדי למצוא 10% מחלקים ב־10', 50: '50% הם חצי', 25: '25% הם רבע', 20: '20% הם חמישית', 5: '5% הם חצי מ־10%', 1: '1% הוא חלק מאה' }[p] + ': ' + P(p) + ' מ־' + N(X) + ' הם ' + N(a) + '.',
      function (i) { return near(r.val(i), a); });
  };
  T.whatPct = function () {
    var b = pick([100, 100, 10, 50, 20]), p = pick([10, 20, 30, 40, 50, 60, 70, 80, 90]), a = b * p / 100;
    if (!Number.isInteger(a)) return T.whatPct();
    var r = numOpts(p, [a, b - a, a / b * 10, 100 - p], P);
    return mk('כמה אחוזים הם חלק מהשלם', 'כמה אחוזים הם ' + N(a) + ' מתוך ' + N(b) + '?', r,
      'מחשבים את החלק מהשלם: ' + M(a + '/' + b + ' = ' + N(p) + '/100') + ', כלומר ' + P(p) + '.', function (i) { return near(r.val(i), p); });
  };
  var DEF = [
    ['מה פירוש 1%?', 'חלק אחד מתוך 100 חלקים שווים של הכמות', ['חלק אחד מתוך 10 חלקים של הכמות', 'הכמות כולה', 'מאה פעמים הכמות']],
    ['100% מכמות מסוימת הם:', 'הכמות כולה', ['מאית מהכמות', 'חצי מהכמות', 'פי 100 מהכמות']],
    ['40% מתלמידי הכיתה הן בנות. איזה אחוז מהתלמידים הם בנים?', '60%', ['40%', '50%', '140%']],
    ['אחוזים הם שברים שהמכנה שלהם הוא:', '100', ['10', '1000', 'המספר הגדול ביותר בשאלה']],
    ['איזה מהבאים שווה ל־50%?', 'חצי', ['רבע', 'חמישית', 'פי 2']]
  ];
  T.concept = function () {
    var d = pick(DEF), r = finalize(d[1], shuffle(d[2]));
    return mk('הבנה: מהם אחוזים', d[0], r, 'אחוזים הם שברים שהמכנה שלהם הוא 100: 1% הוא מאית מהכמות, ו־100% הם הכמות כולה. התשובה: ' + d[1] + '.', function (i) { return r.options[i] === d[1]; });
  };

  var q = Q.list[Q.i], tot = Q.list.length;
  if (!Q.mode) { var myQ = Q; RESUME = function () { Q = myQ; if (Q.answered === Q.i) next(); else showQ(); }; }
  var bar = '<div class="bar"><i style="width:' + (Q.i / tot * 100) + '%"></i></div><div class="meta"><span>' + (Q.mode ? Q.title : LNAME[S.level]) + ' · שאלה ' + (Q.i + 1) + ' מתוך ' + tot + '</span><span>✓ ' + Q.ok + '</span></div>';
  APP.innerHTML = header(bar) + '<div class="card"><p class="q">' + q.prompt + '</p>' + (q.fig ? '<div class="fig">' + q.fig + '</div>' : '') + optsHtml(q) + '<div id="fb"></div></div>';
  window.scrollTo(0, 0);
  APP.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () { answer(+b.dataset.i); }; });
}
function answer(i) {
  var q = Q.list[Q.i], ok = i === q.answer;
  var btns = APP.querySelectorAll('.opt');
  btns.forEach(function (b) { b.disabled = true; });
  btns[q.answer].classList.add('ok'); if (!ok) btns[i].classList.add('no');
  if (ok) Q.ok++; else Q.wrong.push(q.key);
  Q.answered = Q.i; rec(q.key, ok); if (SESS) { SESS.n++; if (ok) SESS.ok++; }
  send({ kind: 'answer', level: Q.mode ? Math.min(S.level, 3) : S.level, attempt: Q.mode ? Q.mode : S.att[S.level], type: q.type, correct: ok ? 1 : 0 });
  save();
  var last = Q.i === Q.list.length - 1;
  document.getElementById('fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b class="t">' + (ok ? 'נכון!' : 'לא בדיוק. התשובה הנכונה: ' + LET[q.answer]) + '</b>' + q.expl + '</div><button class="btn" id="nx">' + (last ? (Q.mode ? 'סיום' : 'לסיכום הרמה') : 'לשאלה הבאה') + '</button>';
  document.getElementById('nx').onclick = next;
  document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function next() { if (Q.i === Q.list.length - 1) { if (Q.mode) Q.done(); else endLevel(); } else { Q.i++; showQ(); } }
function endLevel() {
  var passed = Q.ok >= PASS, L = S.level;
  S.last = 'רמה ' + L + ': ' + Q.ok + '/10';
  send({ kind: 'attempt', level: L, attempt: S.att[L], score: Q.ok, passed: passed ? 1 : 0 });
  if (passed) S.level++;
  save(); send({ kind: 'state' });
  RES = { L: L, ok: Q.ok, passed: passed, wrong: Q.wrong.slice() };
  resultScreen();
}
var RES = null;
function resultScreen() {
  RESUME = resultScreen;
  var L = RES.L, passed = RES.passed, Q = { ok: RES.ok, wrong: RES.wrong };
  var tally = {}; Q.wrong.forEach(function (t) { if (TOPIC[t]) tally[t] = (tally[t] || 0) + 1; });
  var wl = Object.keys(tally).map(function (t) { return '<button class="tp" data-t="' + t + '"><span class="dot ' + (stat(t) || 'y') + '"></span>' + TOPIC[t].n + (tally[t] > 1 ? ' (' + tally[t] + ' טעויות)' : '') + '<span class="sm">הסבר ותרגול ←</span></button>'; }).join('');
  var h = header() + '<div class="card" style="text-align:center"><p class="muted">' + LNAME[L] + '</p><div class="big">' + Q.ok + '/10</div>';
  if (passed) h += '<h2>' + (L === 3 ? 'עברתם את כל שלוש הרמות!' : 'כל הכבוד – עברתם לרמה ' + (L + 1) + '!') + '</h2>';
  else h += '<h2>עוד קצת – צריך 8 נכונות</h2><p>נתרגל שוב את אותה רמה עם שאלות חדשות.</p>';
  if (wl) h += '<div style="text-align:start"><p class="muted" style="margin-bottom:0">' + (passed ? 'כדאי לחזור על:' : 'לפני הניסיון הבא – כדאי לחזור על:') + '</p><div class="tl">' + wl + '</div></div>';
  h += '<button class="btn ' + (passed ? 'gr' : '') + '" id="go">' + (passed ? (L === 3 ? 'לרמת האלופים ★' : 'לרמה ' + (L + 1)) : 'לנסות שוב') + '</button></div>';
  APP.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('go').onclick = route;
  bindTopics(resultScreen);
}

/* ---------- רמה 4 ---------- */
function lvl4Intro() {
  RESUME = lvl4Intro; tick();
  var t, d;
  if (S.stage === 'A') { t = 'שלב א – אתגר בתשובה פתוחה'; d = 'כאן אין אפשרויות לבחירה: כותבים את התשובה בעצמכם. ענו נכון על <b>' + STREAK_GOAL + ' שאלות ברצף</b> כדי לפתוח את שלב החוקר. טעות מאפסת את הרצף.'; }
  else if (S.stage === 'B') { t = 'שלב ב – החוקר'; d = CONF.expIntro; }
  else { t = 'שלב ג – אתגר אינסופי'; d = 'שאלות פתוחות בלי סוף. כמה תשובות נכונות ברצף תצליחו? השיא שלכם: <b>' + S.best + '</b>.'; }
  APP.innerHTML = header() + '<div class="card"><h2>' + LNAME[4] + '</h2><h2 style="font-size:19px">' + t + '</h2><p>' + d + '</p><button class="btn gr" id="go">קדימה</button></div>';
  document.getElementById('go').onclick = function () { if (S.stage === 'B') { Q = { list: GEN.explorer(), i: 0 }; showExp(); } else openQ(); };
}
function openQ() {
  RESUME = openQ;
  var q = GEN.open(); Q = { q: q };
  var top = S.stage === 'A'
    ? '<div class="meta"><span>שלב א · רצף ' + S.streak + ' מתוך ' + STREAK_GOAL + '</span><span>★</span></div><div class="streak">' + Array.from({ length: STREAK_GOAL }, function (_, k) { return '<span class="' + (k < S.streak ? 'on' : '') + '"></span>'; }).join('') + '</div>'
    : '<div class="stat"><div>רצף נוכחי<b>' + S.streak + '</b></div><div>השיא שלי<b>' + S.best + '</b></div></div>';
  APP.innerHTML = header(top) + '<div class="card"><p class="q">' + q.prompt + '</p>' + (q.fig ? '<div class="fig">' + q.fig + '</div>' : '') + '<label class="muted" for="an">התשובה שלי:</label><input id="an" class="ans" inputmode="decimal" autocomplete="off" enterkeyhint="done"><div id="ae" class="err"></div><button class="btn" id="ck">בדיקה</button><div id="fb"></div></div>';
  window.scrollTo(0, 0);
  var inp = document.getElementById('an'), ck = document.getElementById('ck');
  function check() {
    var v = GEN.parseAnswer(inp.value);
    if (isNaN(v)) { document.getElementById('ae').textContent = 'כתבו מספר (אפשר עם מינוס או נקודה עשרונית).'; inp.classList.add('shake'); setTimeout(function () { inp.classList.remove('shake'); }, 400); return; }
    var ok = GEN.near(v, q.value);
    inp.disabled = true; ck.style.display = 'none'; document.getElementById('ae').textContent = '';
    if (ok) { S.streak++; if (S.stage === 'C' && S.streak > S.best) S.best = S.streak; } else S.streak = 0;
    if (S.stage === 'A' && S.streak > S.best) S.best = S.streak;
    S.open++; if (SESS) { SESS.n++; if (ok) SESS.ok++; }
    send({ kind: 'answer', level: 4, attempt: S.stage === 'A' ? 'שלב א' : 'שלב ג', type: q.type, correct: ok ? 1 : 0 });
    var unlock = S.stage === 'A' && S.streak >= STREAK_GOAL;
    if (unlock) { S.stage = 'B'; S.streak = 0; }
    save(); send({ kind: 'state' });
    document.getElementById('fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b class="t">' + (ok ? 'נכון!' : 'לא בדיוק. התשובה: <span class="m" dir="ltr">' + GEN.fmt(q.value) + '</span>') + '</b>' + q.expl + '</div><button class="btn ' + (unlock ? 'gr' : '') + '" id="nx">' + (unlock ? 'פתחתם את שלב החוקר!' : 'לשאלה הבאה') + '</button>';
    document.getElementById('nx').onclick = function () { if (unlock) lvl4Intro(); else openQ(); };
  }
  ck.onclick = check;
  inp.onkeydown = function (e) { if (e.key === 'Enter') check(); };
}
function showExp() {
  var myQ = Q; RESUME = function () { Q = myQ; showExp(); };
  var q = Q.list[Q.i];
  var bar = '<div class="bar"><i style="width:' + (Q.i / Q.list.length * 100) + '%"></i></div><div class="meta"><span>שלב החוקר · ' + (Q.i + 1) + ' מתוך ' + Q.list.length + '</span><span></span></div>';
  APP.innerHTML = header(bar) + '<div class="card"><p class="q">' + q.prompt + '</p>' + (q.fig ? '<div class="fig">' + q.fig + '</div>' : '') + optsHtml(q) + '<div id="fb"></div></div>';
  window.scrollTo(0, 0);
  var first = true;
  APP.querySelectorAll('.opt').forEach(function (b) {
    b.onclick = function () {
      var i = +b.dataset.i, ok = i === q.answer;
      if (first) send({ kind: 'answer', level: 4, attempt: 'חוקר', type: 'חוקר ' + (Q.i + 1), correct: ok ? 1 : 0 });
      first = false;
      if (!ok) { b.classList.add('no'); b.disabled = true; document.getElementById('fb').innerHTML = '<div class="hint"><b>רמז:</b> ' + q.hint + '</div>'; return; }
      APP.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; }); b.classList.add('ok');
      var last = Q.i === Q.list.length - 1;
      document.getElementById('fb').innerHTML = '<div class="fb ok"><b class="t">נכון!</b>' + q.expl + '</div><button class="btn ' + (last ? 'gr' : '') + '" id="nx">' + (last ? 'סיימתי את החוקר' : 'הלאה') + '</button>';
      document.getElementById('nx').onclick = function () {
        if (!last) { Q.i++; showExp(); return; }
        S.stage = 'C'; S.streak = 0; save(); send({ kind: 'state' });
        APP.innerHTML = header() + '<div class="card"><h2>גיליתם!</h2><p>' + CONF.expDone + '</p><button class="btn gr" id="go">לאתגר האינסופי</button></div>';
        document.getElementById('go').onclick = lvl4Intro;
      };
    };
  });
}

/* ---------- ההתקדמות שלי ---------- */
function bindTopics(back) { APP.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { topicScreen(b.dataset.t, back); }; }); }
function backBtn(id) { return '<button class="btn sec" id="' + (id || 'bk') + '">חזרה לתרגול</button>'; }
function progressScreen() {
  tick(); save();
  var back = RESUME || route, top = Math.min(S.level, 3), cnt = { g: 0, y: 0, r: 0 };
  var h = header() + '<div class="card"><h2>ההתקדמות שלי</h2><div class="legend"><span><i class="dot g"></i>שולטים</span><span><i class="dot y"></i>כמעט</span><span><i class="dot r"></i>כדאי לחזק</span><span><i class="dot"></i>עוד לא תרגלנו</span></div>';
  for (var L = 1; L <= 3; L++) {
    var keys = GEN.PLAN[L].filter(function (k, i, a) { return a.indexOf(k) === i && TOPIC[k]; });
    h += '<h3>' + LNAME[L] + (L > top ? ' 🔒' : '') + '</h3><div class="tl">';
    keys.forEach(function (k) {
      var st = stat(k), m = S.m[k]; if (st) cnt[st]++;
      h += '<button class="tp" data-t="' + k + '"' + (L > top && !m ? ' disabled' : '') + '><span class="dot ' + st + '"></span>' + TOPIC[k].n + '<span class="sm">' + (m ? m.ok + '/' + m.n : '') + '</span></button>';
    });
    h += '</div>';
  }
  var mm = mins();
  h += '<p class="muted">סה״כ זמן תרגול: ' + mm.all + ' דקות' + (mm.home ? ' (מתוכן ' + mm.home + ' מחוץ לשעות בית הספר)' : '') + '. לחצו על נושא כדי לראות הסבר, דוגמה ותרגול ממוקד.</p>' + backBtn() + '</div>';
  APP.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('bk').onclick = back;
  bindTopics(progressScreen);
}
function topicScreen(k, back) {
  var T0 = TOPIC[k], q = GEN.T[k](), st = stat(k), m = S.m[k];
  var ans = q.options[q.answer];
  var h = header() + '<div class="card"><h2>' + T0.n + '</h2>';
  if (m) h += '<p class="muted"><span class="dot ' + st + '" style="display:inline-block;vertical-align:middle"></span> ענית נכון על ' + m.ok + ' מתוך ' + m.n + ' שאלות מהסוג הזה.</p>';
  h += '<div class="tip"><b>מה לזכור:</b> ' + T0.t + '<div class="muted" style="margin-top:6px">בספר: ' + CONF.book + ', ' + T0.p + '</div></div>';
  h += '<div class="ex"><b>דוגמה פתורה</b><p class="q" style="margin-top:6px">' + q.prompt + '</p>' + (q.fig ? '<div class="fig">' + q.fig + '</div>' : '') + '<div class="ans"><b>התשובה:</b> ' + ans + '</div><p style="margin:8px 0 0">' + q.expl + '</p></div>';
  h += '<button class="btn gr" id="pr">תרגול ממוקד – 4 שאלות</button><button class="btn sec" id="bk">חזרה</button></div>';
  APP.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('bk').onclick = function () { (back || route)(); };
  document.getElementById('pr').onclick = function () {
    practice([k, k, k, k], 'תרגול ממוקד', 'ממוקד', function () { practiceDone(k, back); });
  };
}
function practice(keys, title, mode, done) {
  Q = { list: keys.map(function (k) { var x = GEN.T[k](); x.key = k; return x; }), i: 0, ok: 0, wrong: [], mode: mode, title: title, done: done };
  showQ();
}
function practiceDone(k, back) {
  var ok = Q.ok, n = Q.list.length, st = stat(k);
  var h = header() + '<div class="card" style="text-align:center"><p class="muted">תרגול ממוקד · ' + TOPIC[k].n + '</p><div class="big">' + ok + '/' + n + '</div>';
  h += '<p>' + (st === 'g' ? 'מצוין – הנושא הזה עכשיו ירוק! 🎉' : ok >= n - 1 ? 'יפה מאוד – עוד קצת והנושא יהיה ירוק.' : 'שווה לקרוא שוב את ההסבר ולנסות עוד סבב.') + '</p>';
  h += '<button class="btn" id="ag">עוד סבב</button><button class="btn sec" id="bk">חזרה</button></div>';
  APP.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('ag').onclick = function () { topicScreen(k, back); };
  document.getElementById('bk').onclick = function () { (back || route)(); };
}

/* ---------- חימום כשחוזרים ---------- */
function warmIntro() {
  RESUME = route;
  var w = weak(), keys = [w[0], w[1] || w[0], w[2] || w[0]];
  var h = header() + '<div class="card"><h2>ברוכים השבים! 👋</h2><p>לפני שממשיכים – 3 שאלות חימום מהנושאים שכדאי לחזק:</p><ul class="ul">' + w.slice(0, 3).map(function (k) { return '<li>' + TOPIC[k].n + '</li>'; }).join('') + '</ul>';
  h += '<button class="btn gr" id="go">לחימום</button><button class="btn sec" id="sk">דלגו, ישר לתרגול</button></div>';
  APP.innerHTML = h;
  document.getElementById('sk').onclick = route;
  document.getElementById('go').onclick = function () {
    practice(keys, 'חימום', 'חימום', function () {
      var ok = Q.ok;
      APP.innerHTML = header() + '<div class="card" style="text-align:center"><p class="muted">חימום</p><div class="big">' + ok + '/3</div><p>' + (ok === 3 ? 'מעולה – זכרתם הכול!' : ok === 2 ? 'יפה! עוד חיזוק קטן ואתם שם.' : 'טוב שחזרנו על זה. אפשר לראות הסבר ב"ההתקדמות שלי".') + '</p><button class="btn gr" id="go">ממשיכים לתרגל</button></div>';
      document.getElementById('go').onclick = route;
    });
  };
}

/* ---------- סיימתי להיום ---------- */
function endSession() {
  tick(); if (!SESS) newSession();
  SESS.nudged = true; save(); send({ kind: 'state' });
  var back = RESUME || route, mm = Math.max(1, Math.round(SESS.sec / 60));
  var up = [], strong = [];
  Object.keys(S.m).forEach(function (k) {
    if (!TOPIC[k]) return; var now = stat(k), was = SESS.snap[k] || '';
    var rank = { '': 0, r: 1, y: 2, g: 3 };
    if (rank[now] > rank[was] && was) up.push(k);
    if (now === 'g') strong.push(k);
  });
  var w = weak().slice(0, 3);
  var h = header() + '<div class="card"><h2>סיכום לתרגול של היום</h2>';
  h += '<div class="stat"><div>דקות<b>' + mm + '</b></div><div>שאלות<b>' + SESS.n + '</b></div><div>נכונות<b>' + SESS.ok + '</b></div></div>';
  if (up.length) h += '<h3>📈 השתפרתם היום ב:</h3><ul class="ul">' + up.map(function (k) { return '<li>' + TOPIC[k].n + '</li>'; }).join('') + '</ul>';
  if (strong.length) h += '<h3>✅ אתם שולטים ב:</h3><p style="margin:0">' + strong.map(function (k) { return TOPIC[k].n; }).join(' · ') + '</p>';
  if (w.length) h += '<h3>🎯 כדאי לחזק בפעם הבאה:</h3><div class="tl">' + w.map(function (k) { return '<button class="tp" data-t="' + k + '"><span class="dot ' + stat(k) + '"></span>' + TOPIC[k].n + '<span class="sm">הסבר ותרגול ←</span></button>'; }).join('') + '</div>';
  else if (SESS.n) h += '<p>אין כרגע נושא שצריך לחזק – כל הכבוד! 🌟</p>';
  var t = taskProg(); if (t) h += '<p>' + (t.done ? '✓ השלמתם את המשימה.' : 'המשימה: ' + t.text + (TASK.due ? ' עד ' + dueTxt(TASK.due) : '') + '.') + '</p>';
  h += '<p class="muted">ההתקדמות נשמרה. אפשר להמשיך מכל טלפון או מחשב – נכנסים עם אותו שם, בית ספר וכיתה.</p>';
  h += '<button class="btn sec" id="bk">להמשיך לתרגל</button></div>';
  APP.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('bk').onclick = back;
  bindTopics(endSession);
}

startScreen();
}
</script>
</body>
